name: build-desktop

# 一律在 GitHub Actions 上打包，本地不产出可分发产物。
on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

# 同一分支只跑最新一次，避免连推时排队
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  TAURI_CLI: "@tauri-apps/cli@^2"
  # Rust / PyInstaller 产物的最低系统版本（macOS 12+）
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[embed,ner]"
      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel (12+)
            # macos-13 已下线；macos-15-intel 是当前唯一的 x64 macOS runner
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: novelrag-macos-x86_64
            bundle_args: "--bundles app"
            sidecar_ext: ""
          - name: Windows x64 (portable)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: novelrag-windows-x64
            bundle_args: "--no-bundle"
            sidecar_ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[embed,ner]"
          python -m pip install "pyinstaller>=6.6"

      # ---------------------------------------------------------------- sidecar
      - name: Build sidecar (PyInstaller)
        working-directory: backend
        run: |
          python -m PyInstaller \
            --noconfirm --clean --onefile \
            --name novel-rag-sidecar \
            --collect-data jieba \
            --collect-all onnxruntime \
            --collect-all tokenizers \
            --hidden-import novel_rag.api.server \
            --distpath dist --workpath build \
            sidecar_entry.py

      - name: Place sidecar for Tauri
        run: |
          set -euo pipefail
          src="backend/dist/novel-rag-sidecar${{ matrix.sidecar_ext }}"
          dst="desktop/src-tauri/binaries/novel-rag-sidecar-${{ matrix.target }}${{ matrix.sidecar_ext }}"
          mkdir -p desktop/src-tauri/binaries
          ls -la backend/dist
          test -f "$src"
          cp "$src" "$dst"
          test -f "$dst"
          ls -la desktop/src-tauri/binaries

      # ---------------------------------------------------------------- frontend
      - name: Vendor foliate-js
        run: python desktop/scripts/prepare_vendor.py

      # ---------------------------------------------------------------- rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # ---------------------------------------------------------------- build
      - name: Build app
        working-directory: desktop
        run: npx --yes ${{ env.TAURI_CLI }} build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      # ---------------------------------------------------------------- package
      - name: Package macOS .app
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          out="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/NovelRag.app"
          test -d "$out"

          # sidecar 必须可执行且带签名：externalBin 若没被 Tauri 签名，
          # Gatekeeper 会直接杀掉子进程，表现为「本地后端启动超时」。
          chmod +x "$out/Contents/MacOS/novel-rag-sidecar" "$out/Contents/MacOS/novel-rag-desktop"
          test -x "$out/Contents/MacOS/novel-rag-sidecar"
          codesign --force --sign - "$out/Contents/MacOS/novel-rag-sidecar"
          codesign --force --sign - "$out"
          codesign --verify --verbose=2 "$out" || true

          # 把 sidecar 的架构与签名结果打进日志，方便回溯
          file "$out/Contents/MacOS/"*
          codesign -dv "$out/Contents/MacOS/novel-rag-sidecar" 2>&1 | head -5 || true

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$out" "dist/novelrag-macos-x86_64.zip"
          ls -lh dist

      - name: Package Windows portable
        if: matrix.os == 'windows-latest'
        run: |
          set -euo pipefail
          exe="desktop/src-tauri/target/${{ matrix.target }}/release/NovelRag.exe"
          if [ ! -f "$exe" ]; then
            exe="desktop/src-tauri/target/${{ matrix.target }}/release/novel-rag-desktop.exe"
          fi
          test -f "$exe"
          mkdir -p dist/NovelRag
          cp "$exe" dist/NovelRag/NovelRag.exe
          cp "backend/dist/novel-rag-sidecar.exe" dist/NovelRag/novel-rag-sidecar.exe
          # 用 ASCII 文件名：Git Bash 写 CJK 文件名会按控制台代码页转码，zip 里会变成乱码
          cp desktop/PORTABLE-README.txt dist/NovelRag/PORTABLE-README.txt
          # 不用 tar/7z：bsdtar 的 -a 在 Windows 上不会推断成 zip（实测产出 POSIX tar）
          python - <<'EOF'
          import pathlib, zipfile
          root = pathlib.Path("dist") / "NovelRag"
          out = pathlib.Path("dist") / "novelrag-windows-x64.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(root.parent))
          print("zip:", out, out.stat().st_size)
          EOF
          ls -lh dist

      # 不用 upload-artifact：账户的 Actions 产物配额经常打满，
      # 直接把 zip 挂到 Release（tag 构建）或在 job summary 里给出路径。
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -lh dist/*.zip
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --title "Novel RAG $tag" --notes-file desktop/RELEASE-NOTES.md
          gh release upload "$tag" dist/*.zip --clobber

      - name: Summarize
        run: |
          {
            echo "### ${{ matrix.artifact }}"
            echo '```'
            ls -lh dist/*.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
