name: build-image

# Web 部署镜像：只在 GitHub Actions 上构建并推送到 ghcr.io。
# 本地一律 `docker pull`（见 Dockerfile / docker-compose.yml），不做本地构建。
on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "desktop/web/**"
      - "desktop/scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "desktop/web/**"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[embed,ner]"
      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

  image:
    name: docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=novel-rag
            org.opencontainers.image.description=AI 小说阅读器：本地优先的小说知识库（Web/Docker 部署）

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像构建出来先自己跑一遍：静态前端能出页面、/api/health 能通。
      # PR 不推送，所以没有可拉取的镜像，跳过。
      - name: Smoke test image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name novelrag-smoke -p 8000:8000 \
            -e NOVEL_RAG_DISABLE_AUTH=1 \
            -e NOVEL_RAG_EMBED_BACKEND=hash \
            "$IMAGE"
          trap 'docker rm -f novelrag-smoke >/dev/null 2>&1 || true' EXIT

          fail() { echo "::error::$1"; docker logs novelrag-smoke 2>&1 | tail -30 || true; exit 1; }

          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o health.json http://127.0.0.1:8000/api/health 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || fail "镜像启动后 /api/health 不通"
          grep -q '"ok"' health.json || fail "/api/health 返回异常（见 health.json）"

          # 静态前端：首页、同源客户端、阅读引擎（foliate-js 是构建期拉取的，最容易漏）
          check() {  # path pattern label
            curl -fsS -o body.tmp "http://127.0.0.1:8000$1" || fail "$3 拉取失败（$1）"
            grep -q -- "$2" body.tmp || fail "$3 内容不符（$1）"
            echo "ok: $3"
          }
          check / 'Novel RAG' "index.html"
          check /js/api.js 'sameOrigin' "同源 Web 客户端"
          check /vendor/foliate-js/view.js 'customElements' "foliate-js 阅读引擎"

          docker inspect --format 'health={{.State.Health.Status}}' novelrag-smoke || true
          echo "image smoke ok: $IMAGE"

      - name: Summarize
        run: |
          {
            echo "### docker image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "拉取：\`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
